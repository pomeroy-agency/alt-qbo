[build]
  publish = "web"
  command = "npm run typecheck"

[functions]
  node_bundler = "esbuild"

# The app lives at app.pomeroyagency.com; the old Netlify address sends people (and links in old emails) there.
# Deploy previews have their own addresses and aren't affected.
[[redirects]]
  from = "https://alt-qbo.netlify.app/*"
  to = "https://app.pomeroyagency.com/:splat"
  status = 301
  force = true

# Single-page app: unknown paths fall back to the shell (API routes are served by the function first).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'"
