[build]
  publish = "web"
  command = "npm run typecheck"

# The MilePost OAuth client ID ("milepost") is public, and the word appears throughout the code,
# so the secrets scan skips it. The client secret is still scanned.
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "MILEPOST_OAUTH_CLIENT_ID"

[functions]
  node_bundler = "esbuild"

# The old netlify.app address forwards to the real domain (deploy previews use other hosts, so they're unaffected).
[[redirects]]
  from = "https://alt-qbo.netlify.app/*"
  to = "https://app.pomeroyagency.com/:splat"
  status = 301
  force = true

# Single-page app: unknown paths fall back to the shell (API routes are served by the function first).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'"
