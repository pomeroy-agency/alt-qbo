<script>
(function () {
/* Wix iframe safety net: every link breaks out to the top window */
document.querySelectorAll('a[href]').forEach(function (a) {
var href = a.getAttribute('href') || '';
if (href.charAt(0) === '#' || href.indexOf('javascript:') === 0) return;
if (a.getAttribute('target') !== '_blank' && !a.hasAttribute('target')) a.setAttribute('target', '_top');
var rel = (a.getAttribute('rel') || '').trim();
if (href.indexOf('http') === 0 && rel.indexOf('noopener') === -1) {
a.setAttribute('rel', (rel + ' noopener').trim());
}
});

/* Smooth-scroll in-page anchors without letting Wix hijack them */
document.querySelectorAll('a[href^="#"]').forEach(function (a) {
a.addEventListener('click', function (ev) {
var t = document.querySelector(a.getAttribute('href'));
if (t) { ev.preventDefault(); t.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
});
});
})();
</script>

<script>
(function(){

n=document.querySelector('.nav-primary'),

if(tr&&sv){tr.addEventListener('click',function(e){

},false);}
})();
</script>
