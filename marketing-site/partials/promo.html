<!-- TRAILBOOK-PROMO START (2026-10-28). Self-contained: its own styles, no shared class names. -->
<section class="tbp" id="trailbook">
<style>
.tbp{background:#1b2a41;color:#fff;padding:72px 0;position:relative;z-index:1;border-top:1px solid rgba(212,160,32,0.28);border-bottom:1px solid rgba(212,160,32,0.28)}
.tbp-in{max-width:1180px;margin:0 auto;padding:0 26px;display:grid;grid-template-columns:1.25fr 1fr;gap:56px;align-items:center}
.tbp-k{font-family:var(--mono,'JetBrains Mono',monospace);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold-bright,#d4a020);margin:0 0 16px}
.tbp h2{font-family:var(--serif,'Fraunces',Georgia,serif);font-weight:400;font-size:clamp(28px,3.8vw,44px);line-height:1.1;letter-spacing:-.015em;color:#fff;margin:0}
.tbp h2 em{font-style:italic;color:var(--gold-bright,#d4a020)}
.tbp-p{margin:18px 0 0;font-size:16.5px;line-height:1.62;color:rgba(255,255,255,.68);max-width:56ch}
.tbp-box{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.12);border-radius:6px;padding:26px}
.tbp-row{display:flex;justify-content:space-between;align-items:baseline;gap:14px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.10);font-size:14.5px;color:rgba(255,255,255,.82)}
.tbp-row b{font-family:var(--serif,'Fraunces',Georgia,serif);font-weight:500;font-size:22px;color:#fff;white-space:nowrap}
.tbp-row small{font-size:12px;color:rgba(255,255,255,.5)}
.tbp-btns{display:flex;flex-wrap:wrap;gap:12px;margin-top:22px}
.tbp-btn{display:inline-flex;align-items:center;gap:9px;padding:13px 20px;font-size:14.5px;font-weight:600;text-decoration:none;border-radius:3px;font-family:var(--sans,'Geist',system-ui,sans-serif)}
.tbp-gold{background:var(--gold,#b07c10);color:#fff;border:1px solid var(--gold,#b07c10)}
.tbp-gold:hover{background:var(--gold-bright,#d4a020)}
.tbp-line{color:rgba(255,255,255,.85);border:1px solid rgba(255,255,255,.26)}
.tbp-line:hover{border-color:rgba(212,160,32,.6);color:#fff}
.tbp-fine{margin:14px 0 0;font-size:12.5px;color:rgba(255,255,255,.45)}
@media(max-width:900px){.tbp-in{grid-template-columns:1fr;gap:32px}}
@media(max-width:620px){.tbp{padding:52px 0}.tbp-in{padding:0 20px}}
</style>
<div class="tbp-in">
<div>
<p class="tbp-k">%%KICKER%%</p>
<h2>%%HEADLINE%%</h2>
<p class="tbp-p">%%TEXT%%</p>
</div>
<div class="tbp-box">
<div class="tbp-row"><span>Books<br><small>Invoices, bank reconciliation, reports, sales tax</small></span><b>$15<small>/mo</small></b></div>
<div class="tbp-row"><span>Books + Payroll<br><small>Plus pay runs, stubs and prepared payroll forms</small></span><b>$35<small>/mo + $4/person</small></b></div>
<div class="tbp-btns">
<a class="tbp-btn tbp-gold" href="https://www.pomeroyagency.com/trailbook" target="_top" data-pa-event="trailbook_promo_click" data-pa-label="%%LABEL%%">See TrailBook &rarr;</a>
<a class="tbp-btn tbp-line" href="%%APP%%/#/signup" target="_top" data-pa-event="trailbook_trial_click" data-pa-label="%%LABEL%%">Start free trial</a>
</div>
<p class="tbp-fine">30 days free, no card needed. For US businesses, in 13 states and counting.</p>
</div>
</div>
</section>
<!-- TRAILBOOK-PROMO END -->
